<!-- Capa d'arrencada. L'estil va en linia i sense dependre de styles.css perque
     ha de pintar-se al primer fotograma. Es retira quan React ha muntat. -->
<style>
  #pm-boot{position:fixed;inset:0;z-index:999;display:grid;place-items:center;
    background:#080B18;color:#F2F5FF;font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif;
    transition:opacity .5s ease,visibility .5s ease}
  #pm-boot::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 70% 55% at 50% 42%,rgba(31,90,43,.30),transparent 70%)}
  #pm-boot.is-done{opacity:0;visibility:hidden}
  .boot-in{position:relative;display:grid;justify-items:center;gap:22px;padding:24px;text-align:center}

  /* Cinc cartes que surten del mall i formen un ventall */
  .boot-fan{position:relative;width:200px;height:96px}
  .boot-fan i{position:absolute;left:50%;top:0;width:52px;height:74px;margin-left:-26px;border-radius:6px;
    background:linear-gradient(140deg,#1F5A2B,#0C2211 62%,#17401F);
    border:1px solid rgba(227,190,85,.30);box-shadow:0 10px 26px -12px rgba(0,0,0,.85);
    transform-origin:50% 130%;opacity:0;animation:boot-deal 2.4s cubic-bezier(.22,.8,.3,1) infinite}
  .boot-fan i::after{content:"";position:absolute;inset:6px;border-radius:3px;border:1px solid rgba(227,190,85,.16)}
  .boot-fan i:nth-child(1){--dx:-64px;--rot:-22deg;animation-delay:0s}
  .boot-fan i:nth-child(2){--dx:-33px;--rot:-11deg;animation-delay:.16s}
  .boot-fan i:nth-child(3){--dx:0px;--rot:0deg;animation-delay:.32s}
  .boot-fan i:nth-child(4){--dx:33px;--rot:11deg;animation-delay:.48s}
  .boot-fan i:nth-child(5){--dx:64px;--rot:22deg;animation-delay:.64s}
  @keyframes boot-deal{
    0%{opacity:0;transform:translate(0,14px) rotate(0deg) scale(.92)}
    14%{opacity:1}
    46%,74%{opacity:1;transform:translate(var(--dx,0),0) rotate(var(--rot,0deg))}
    100%{opacity:0;transform:translate(var(--dx,0),-10px) rotate(var(--rot,0deg)) scale(.98)}}

  .boot-word{display:flex;align-items:center;gap:10px;font-size:1.5rem;font-weight:700;letter-spacing:-.03em}
  .boot-pip{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;
    background:linear-gradient(145deg,#F3D98C,#E3BE55);color:#0A0E27;font-size:1rem;
    animation:boot-pulse 2.4s ease-in-out infinite}
  @keyframes boot-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  .boot-tag{font-family:Inter,system-ui,sans-serif;font-size:.86rem;color:#AFB8D0;max-width:30ch;line-height:1.5}
  .boot-tag b{color:#E3BE55;font-weight:600}

  .boot-meter{display:grid;gap:8px;width:min(74vw,260px)}
  .boot-track{height:3px;border-radius:999px;background:rgba(175,184,208,.14);overflow:hidden}
  .boot-fill{height:100%;width:2%;border-radius:999px;
    background:linear-gradient(90deg,#8C6F1E,#E3BE55,#F3D98C);transition:width .28s cubic-bezier(.3,.7,.4,1)}
  .boot-row{display:flex;justify-content:space-between;align-items:center;
    font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:.68rem;color:#565F7A;letter-spacing:.06em}

  @media (prefers-color-scheme:light){
    #pm-boot{background:#EEF0EC;color:#0F1720}
    #pm-boot .boot-tag{color:#414D5C}
    #pm-boot .boot-tag b{color:#8A6A11}
    #pm-boot .boot-track{background:rgba(15,23,32,.12)}
    #pm-boot .boot-row{color:#8B95A1}
  }
  @media (prefers-reduced-motion:reduce){
    #pm-boot .boot-fan i{animation:none;opacity:1;transform:translate(var(--dx,0),0) rotate(var(--rot,0deg))}
    #pm-boot .boot-pip{animation:none}
    #pm-boot{transition:none}
  }
</style>

<body>
<div id="pm-boot" role="status" aria-live="polite" aria-label="Carregant PokerMind">
  <div class="boot-in">
    <div class="boot-fan" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="boot-word"><span class="boot-pip" aria-hidden="true">&#9824;</span>PokerMind</div>
    <p class="boot-tag">Domina el P&#242;quer. <b>Domina la teva Ment.</b></p>
    <div class="boot-meter">
      <div class="boot-track"><div class="boot-fill" id="pm-boot-fill"></div></div>
      <div class="boot-row"><span>Preparant la taula</span><span id="pm-boot-pct">0%</span></div>
    </div>
  </div>
</div>

<script>
/* Progres real d'arrencada: cada script marcat crida tick() al carregar-se.
   TOTAL ha de coincidir amb el nombre d'aquests scripts (llista al final del fitxer).
   Si el muntatge falla, un rellotge de seguretat retira la capa als 12 s perque el
   contingut de reserva de #root quedi accessible igualment. */
window.PMBOOT = (function () {
  'use strict';
  var TOTAL = 27, done = 0, finished = false, shown = 0;
  var fill = document.getElementById('pm-boot-fill');
  var pct  = document.getElementById('pm-boot-pct');
  function paint(p) {
    p = Math.max(shown, Math.min(1, p));          /* mai va enrere */
    shown = p;
    if (fill) fill.style.width = (p * 100).toFixed(0) + '%';
    if (pct) pct.textContent = Math.round(p * 100) + '%';
  }
  var guard = setTimeout(function () { window.PMBOOT.done(); }, 12000);
  return {
    tick: function () { done++; paint(Math.min(0.94, done / TOTAL * 0.94)); },
    done: function () {
      if (finished) return;
      finished = true;
      clearTimeout(guard);
      paint(1);
      var el = document.getElementById('pm-boot');
      if (!el) return;
      setTimeout(function () {
        el.classList.add('is-done');
        setTimeout(function () { el.parentNode && el.parentNode.removeChild(el); }, 600);
      }, 180);
    }
  };
})();
</script>
